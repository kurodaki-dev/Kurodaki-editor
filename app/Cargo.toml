[package]
name = "kurodaki-editor"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "kurodaki_editor"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kurodaki-editor"
path = "src/main.rs"

[dependencies]
kurodaki-core = { path = "../core", features = ["onnx"] }
eframe = { version = "0.29", default-features = false, features = ["android-native-activity", "glow", "default_fonts"] }
egui = "0.29"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "dev.kurodaki.editor"
apk_name = "kurodaki-editor"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.signing.release]
path = "ci.keystore"
keystore_password = "android"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[package.metadata.android.application]
label = "Kurodaki Editor"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize"
